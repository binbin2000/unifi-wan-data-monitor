name: Tests
on: [push, pull_request, workflow_dispatch]
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements-test.txt
      - run: ruff check .
      - run: pytest -q tests
  home-assistant:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python: '3.13'
            homeassistant: '2025.3.4'
          - python: '3.14'
            homeassistant: '2026.10.1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install homeassistant==${{ matrix.homeassistant }} pytest pytest-asyncio
      - run: pytest -q ha_tests
